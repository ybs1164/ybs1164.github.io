<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Numberer</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #6b6b6b;
    --accent: #4f46e5;
    --border: #e5e5e5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f0f10;
      --fg: #f2f2f2;
      --muted: #a0a0a0;
      --accent: #818cf8;
      --border: #2a2a2a;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  main {
    max-width: 420px;
    width: 100%;
    text-align: center;
  }
  h1 {
    font-size: 1.75rem;
    margin: 0 0 4px;
    letter-spacing: -0.02em;
  }
  p.tagline {
    color: var(--muted);
    margin: 0 0 28px;
    font-size: 0.95rem;
  }
  .links {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  a.link {
    display: block;
    padding: 12px 16px;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--fg);
    text-decoration: none;
    font-size: 0.95rem;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  a.link:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
  }
  a.link .label {
    font-weight: 600;
  }
  a.link .desc {
    display: block;
    color: var(--muted);
    font-size: 0.82rem;
    margin-top: 2px;
  }
  footer {
    margin-top: 32px;
    color: var(--muted);
    font-size: 0.78rem;
  }
</style>
</head>
<body>
<main>
  <h1>Numberer</h1>
  <p class="tagline">Indie game developer</p>
  <div class="links">
    <a class="link" href="https://discord.gg/a9qbwygpcp" target="_blank" rel="noopener">
      <span class="label">Discord</span>
      <span class="desc">문의 및 커뮤니티</span>
    </a>
    <a class="link" href="https://github.com/ybs1164" target="_blank" rel="noopener">
      <span class="label">GitHub</span>
      <span class="desc">@ybs1164</span>
    </a>
  </div>
  <footer>&copy; 2026 Numberer</footer>
</main>
</body>
</html>
