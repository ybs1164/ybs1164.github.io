<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog - Numberer</title>
<meta name="description" content="Numberer의 블로그">
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #6b6b6b;
    --accent: #4f46e5;
    --border: #e5e5e5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f0f10;
      --fg: #f2f2f2;
      --muted: #a0a0a0;
      --accent: #818cf8;
      --border: #2a2a2a;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, Roboto, sans-serif;
    padding: 24px;
  }
  main {
    max-width: 680px;
    margin: 0 auto;
  }
  a { color: var(--accent); }
  header.site-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 32px;
    font-size: 0.9rem;
  }
  header.site-header a.home { color: var(--fg); text-decoration: none; font-weight: 700; }
  h1 { font-size: 1.9rem; letter-spacing: -0.02em; margin: 0 0 8px; }
  .post-meta { color: var(--muted); font-size: 0.85rem; margin-bottom: 32px; }
  .post-meta .tag {
    display: inline-block;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 10px;
    margin-right: 6px;
    font-size: 0.78rem;
  }
  .post-list { list-style: none; padding: 0; margin: 0; }
  .post-list li {
    padding: 16px 0;
    border-bottom: 1px solid var(--border);
  }
  .post-list li:first-child { padding-top: 0; }
  .post-list a { text-decoration: none; color: var(--fg); font-weight: 600; font-size: 1.05rem; }
  .post-list .post-date { color: var(--muted); font-size: 0.82rem; margin-top: 4px; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  .content img { max-width: 100%; border-radius: 8px; }
  .content pre {
    background: var(--border);
    padding: 12px 16px;
    border-radius: 8px;
    overflow-x: auto;
  }
  .content code { font-family: "SFMono-Regular", Consolas, monospace; }
  .content blockquote {
    margin: 0;
    padding-left: 16px;
    border-left: 3px solid var(--border);
    color: var(--muted);
  }
  footer { margin-top: 48px; color: var(--muted); font-size: 0.78rem; text-align: center; }
</style>
</head>
<body>
<main>
  <header class="site-header">
    <a class="home" href="../index.html">Numberer</a>
    <a href="../blog/index.html">Blog</a>
  </header>
  
    <h1>Blog</h1>
    <ul class="post-list">
      <li>
        <a href="./개발-블로그-시작합니다/index.html">개발 블로그 시작합니다.</a>
        <div class="post-date">2026-09-15</div>
      </li></ul>
  
  <footer>&copy; 2026 Numberer</footer>
</main>
</body>
</html>
