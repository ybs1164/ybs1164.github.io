    </div>

  <div class="rulebook-layout">
    <nav class="rule-index" aria-label="규칙 목차">
      <p>CONTENTS</p>
      <ol>
        <li><a href="#components"><span>01</span>구성품</a></li>

    <div class="rule-content">

  <section class="rule-section" id="components">
    <h3><span>01</span>구성품</h3>
    <div class="steps">
      <figure>
        <div class="art"><img src="/assets/gyeol/rules/setting.webp?v=20261114-rules" width="1200" height="857" loading="lazy" alt="양면 타일 다섯 묶음, 한 묶음에 다섯 개씩 총 25개"></div>
        <figcaption>양면의 화살표 테두리 색이 다른 <strong>타일 25개</strong>를 준비합니다. 두 사람은 갈색과 흰색 화살표 중 자신의 색을 정합니다.</figcaption>
      </figure>
    </div>
  </section>

  <section class="rule-section" id="setup">
    <h3><span>02</span>초기 배치</h3>
    <div class="steps">
      <figure>
        <div class="art"><img src="/assets/gyeol/rules/first.webp?v=20261114-rules" width="1200" height="857" loading="lazy" alt="갈색 화살표와 흰색 화살표 타일 두 개가 서로를 바라보는 초기 배치"></div>
        <figcaption>화살표 테두리 색이 다른 타일 두 개를 <strong>서로 마주보게</strong> 둡니다.</figcaption>
      </figure>
    </div>
  </section>

  <section class="rule-section" id="goal">
    <h3><span>03</span>목표</h3>
    <div class="steps">
      <figure>
        <div class="art"><img src="/assets/gyeol/rules/goal.webp?v=20261114-goal-opacity-2" width="1200" height="857" loading="lazy" alt="5×5 배치에서 승리한 갈색 화살표 타일 15개는 진하게, 패배한 흰색 화살표 타일 10개는 반투명하게 표시"></div>
        <figcaption>타일 25개를 모두 놓으면 게임이 끝납니다. <strong>자신의 화살표 색 타일이 더 많은 사람이 승리합니다.</strong> 두 사람 모두 둘 수 없는 경우에도 게임을 끝내고 타일 수를 셉니다.</figcaption>
      </figure>
    </div>
  </section>

  <section class="rule-section" id="turn">
    <h3><span>04</span>행동</h3>
    <div class="steps">
      <figure>
        <div class="art"><img src="/assets/gyeol/rules/do.webp?v=20261114-rules" width="1200" height="857" loading="lazy" alt="주변 타일 사이에서 1번 상대 타일을 돌리고, 2번 그 타일을 향하도록 내 타일을 놓는 예시"></div>
        <figcaption>자신의 차례에는 <strong>① 상대 타일 돌리기 → ② 내 타일 놓기</strong>를 차례로 진행합니다.</figcaption>
      </figure>
    </div>
  </section>

  <section class="rule-section" id="rotate">
    <h3><span>05</span>돌리기</h3>
    <div class="steps">
      <figure>
        <div class="art"><img src="/assets/gyeol/rules/turn.webp?v=20261114-rules" width="1200" height="857" loading="lazy" alt="주변 타일 사이의 흰색 화살표 타일을 곡선 화살표를 따라 위쪽에서 오른쪽으로 돌리는 모습"></div>
        <figcaption>상대의 타일 하나를 골라 동서남북 중 한 곳으로 돌립니다.</figcaption>
      </figure>
      <figure>
        <div class="art"><img src="/assets/gyeol/rules/turnlimit.webp?v=20261114-rules" width="1200" height="857" loading="lazy" alt="기존의 위쪽 방향은 X 표시, 나머지 왼쪽과 오른쪽과 아래쪽 방향으로 돌릴 수 있음"></div>
        <figcaption><strong>기존에 바라보던 방향으로는 돌릴 수 없습니다.</strong> 나머지 세 방향 중 하나를 고릅니다.</figcaption>
      </figure>
    </div>
  </section>

  <section class="rule-section" id="place">
    <h3><span>06</span>놓기</h3>
    <div class="steps">
      <figure>
        <div class="art"><img src="/assets/gyeol/rules/put.webp?v=20261114-rules" width="1200" height="857" loading="lazy" alt="돌린 상대 타일의 오른쪽과 아래쪽 빈칸에 각각 왼쪽과 위쪽을 향하는 내 타일 미리보기"></div>
        <figcaption>돌린 상대 타일과 동서남북으로 인접한 빈칸 하나에 자신의 타일을 놓습니다. <strong>새 타일의 화살표는 반드시 방금 돌린 상대 타일을 바라보게 둡니다.</strong></figcaption>
      </figure>
      <figure>
        <div class="art"><img src="/assets/gyeol/rules/fivelimit.webp?v=20261114-rules" width="1200" height="857" loading="lazy" alt="타일 다섯 개로 채운 가로줄 양 끝은 X 표시, 최대 다섯 칸"></div>
        <figcaption>전체 배치는 <strong>가로·세로 각각 5칸 이내</strong>여야 합니다. 한 줄이 5칸에 이르면 그 줄의 바깥으로는 타일을 놓을 수 없습니다.</figcaption>
      </figure>
    </div>
  </section>

  <section class="rule-section" id="capture">
    <h3><span>07</span>먹기</h3>
    <div class="steps">
      <figure>
        <div class="art"><img src="/assets/gyeol/rules/follow.webp?v=20261114-rules" width="1200" height="857" loading="lazy" alt="새로 놓은 갈색 타일에서 흰색 화살표 세 개를 따라 다른 갈색 타일에 닿는 경로"></div>
        <figcaption><span class="caption-label">01 / 경로 따라가기</span>새로 놓은 타일부터 시작해 상대 타일의 화살표 경로를 계속 따라갑니다.</figcaption>
      </figure>
      <figure>
        <div class="art"><img src="/assets/gyeol/rules/swap.webp?v=20261114-rules" width="1200" height="857" loading="lazy" alt="같은 경로 위의 흰색 화살표 타일 세 개를 갈색 화살표로 뒤집은 모습"></div>
        <figcaption><span class="caption-label">02 / 뒤집기</span>마지막 상대 타일이 <strong>다른 내 타일</strong>을 바라본다면, 그 경로 사이의 모든 상대 타일을 뒤집습니다.</figcaption>
      </figure>
    </div>
  </section>

  <section class="rule-section" id="pass">
    <h3><span>08</span>패스</h3>
    <div class="steps">
      <figure>
        <div class="art"><img src="/assets/gyeol/rules/turnoff.webp?v=20261114-rules" width="1200" height="857" loading="lazy" alt="5×5 배치의 빈칸이 모두 갈색 타일에만 인접해 갈색이 놓을 수 없어 패스하는 예시"></div>
        <figcaption><strong>돌리기와 놓기를 모두 진행할 수 없다면</strong> 상대에게 차례를 넘깁니다. 할 수 있는 수가 있을 때는 패스할 수 없습니다.</figcaption>
      </figure>
    </div>
  </section>
