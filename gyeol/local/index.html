<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>결 · 번갈아 플레이</title>
<style>
  :root {
    --bg: #f3efe7;
    --panel: #fbf8f2;
    --ink: #3b3a36;
    --muted: #8a857a;
    --line: #ddd5c6;
    --green: #3f8f47;
    --green-dark: #2f6f36;
    --brown: #a8532f;
    --brown-dark: #7f3d22;
    --arrow: #ece4d3;
    --accent: #d9a441;
    --target: rgba(63, 143, 71, .18);
    --cell: min(70px, calc((100vw - 102px) / 7));
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1e1d1b; --panel: #282724; --ink: #ebe6dc; --muted: #9c968a; --line: #3d3a35;
      --target: rgba(120, 200, 128, .2);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    display: flex; justify-content: center; padding: 24px 16px 40px;
  }
  main { width: 100%; max-width: 560px; }
  h1 { font-size: 22px; letter-spacing: .5em; margin: 0 0 4px; font-weight: 700; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }

  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  select, button {
    font: inherit; font-size: 14px; color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer;
  }
  button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  button:disabled { opacity: .45; cursor: default; }

  .score { display: flex; gap: 10px; margin-bottom: 12px; }
  .side {
    flex: 1; display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    transition: box-shadow .2s, border-color .2s;
  }
  .side.turn { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
  .chip { width: 22px; height: 22px; border-radius: 5px; flex: none; }
  .chip.g { background: var(--green); } .chip.b { background: var(--brown); }
  .side .name { font-size: 13px; color: var(--muted); }
  .side .num { font-size: 22px; font-weight: 700; margin-left: auto; font-variant-numeric: tabular-nums; }

  .status { min-height: 44px; font-size: 15px; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .spinner { width: 16px; height: 16px; border: 2px solid var(--line); border-top-color: var(--ink); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .board-wrap { display: flex; justify-content: center; gap: 10px; align-items: stretch; }
  .advantage {
    width: 36px; flex: none; position: relative; display: flex; flex-direction: column;
    overflow: hidden; border: 1px solid var(--line); border-radius: 10px;
    font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; color: #fff;
  }
  .advantage::after {
    content: ""; position: absolute; top: 50%; left: 0; right: 0;
    border-top: 1px solid rgba(255,255,255,.65); pointer-events: none;
  }
  .advantage-part { display: flex; justify-content: center; min-height: 0; transition: flex-grow .3s ease; }
  .advantage-part.g { background: var(--green); flex: 1; align-items: flex-start; padding-top: 10px; }
  .advantage-part.b { background: var(--brown); flex: 1; align-items: flex-end; padding-bottom: 10px; }
  .advantage-part span { z-index: 1; }
  .advantage-even { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--panel); color: var(--ink); border-radius: 4px; padding: 2px 4px; z-index: 1; }
  .board {
    display: grid; grid-template-columns: repeat(7, var(--cell)); grid-template-rows: repeat(7, var(--cell));
    gap: 0; padding: 10px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line);
    user-select: none; touch-action: manipulation;
  }
  .cell { position: relative; width: var(--cell); height: var(--cell); padding: 3px; }
  @media (max-width: 600px) {
    :root { --cell: min(70px, calc((100vw - 76px) / 7)); }
    body { padding-left: 10px; padding-right: 10px; }
    .board-wrap { gap: 8px; }
    .advantage { width: 34px; }
    .board { padding: 6px; }
    .cell { padding: 2px; }
  }
  .cell.target::before {
    content: ""; position: absolute; inset: 5px; border-radius: 10px;
    border: 2px dashed var(--green); background: var(--target); cursor: pointer;
  }
  .cell.target.mine-b::before { border-color: var(--brown); background: rgba(168, 83, 47, .15); }

  .tile {
    width: 100%; height: 100%; border-radius: 10px; position: relative;
    box-shadow: 0 2px 0 rgba(0,0,0,.18), 0 3px 8px rgba(0,0,0,.12);
    transition: transform .25s;
  }
  .tile.g { background: var(--green); } .tile.b { background: var(--brown); }
  .tile svg { width: 100%; height: 100%; display: block; }
  .tile svg g { transition: transform .3s; transform-origin: 50px 50px; }
  .tile.pickable { cursor: pointer; }
  .tile.pickable:hover { transform: translateY(-3px); }
  .tile.pickable::after {
    content: ""; position: absolute; inset: -3px; border-radius: 12px; border: 2px solid var(--accent);
    opacity: .75; pointer-events: none;
  }
  .tile.selected { transform: rotate(-8deg) scale(1.05); z-index: 2; }
  .tile.ghost { opacity: .55; }
  .tile.last-place::after, .tile.last-rotate::after {
    content: ""; position: absolute; inset: -3px; border-radius: 12px; pointer-events: none;
    border: 2px solid var(--ink); opacity: .6;
  }
  .tile.last-rotate::after { border-style: dashed; }
  .tile.flip { animation: flip .5s ease; }
  @keyframes flip { 0% { transform: rotateY(0) } 50% { transform: rotateY(90deg) } 100% { transform: rotateY(0) } }
  .tile.pop { animation: pop .3s ease; }
  @keyframes pop { 0% { transform: scale(.6); opacity: 0 } 100% { transform: scale(1); opacity: 1 } }

  /* 방향 고르기 */
  .picker { position: absolute; inset: 0; z-index: 5; }
  .picker button {
    position: absolute; width: 44%; height: 44%; padding: 0; border-radius: 50%;
    background: var(--ink); color: var(--bg); border: 2px solid var(--bg); font-size: 15px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 6px rgba(0,0,0,.3);
  }
  .picker button:hover { background: var(--accent); color: #222; }
  .picker .d0 { left: 28%; top: -22%; } .picker .d1 { right: -22%; top: 28%; }
  .picker .d2 { left: 28%; bottom: -22%; } .picker .d3 { left: -22%; top: 28%; }

  .help { margin-top: 18px; font-size: 13px; color: var(--muted); line-height: 1.7; }
  .help b { color: var(--ink); font-weight: 600; }
  .warn { color: var(--brown); font-size: 13px; }

.cell.target svg { position:absolute; inset:20%; width:60%; height:60%; pointer-events:none; opacity:.65; }
.cell.target svg g { transform-origin:50% 50%; }
:focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
</style>
</head>
<body><main>
<a href="../" style="color:var(--muted)">← 결 소개</a>
<h1>결 GYEOL</h1>
<p class="sub">한 기기에서 번갈아 플레이</p>
<div class="controls"><button id="newBtn" class="primary">새 게임</button><button id="undoBtn">한 수 되돌리기</button><button id="cancelBtn">선택 취소</button></div>
<div class="score">
<div class="side" id="sideG"><div class="chip g"></div><span>초록 · 선공</span><span class="num" id="numG"></span></div>
<div class="side" id="sideB"><div class="chip b"></div><span>갈색 · 후공</span><span class="num" id="numB"></span></div>
</div>
<div class="status" id="status" role="status" aria-live="polite"></div>
<div class="board-wrap"><div class="board" id="board" aria-label="결 게임판"></div></div>
<p class="help">한 기기에서 초록과 갈색을 번갈아 조작합니다. 상대 타일을 돌린 뒤, 인접한 빈칸에 내 타일을 놓으세요. <b>놓는 타일의 화살표는 방금 돌린 상대 타일을 반드시 향합니다.</b> 빈칸의 화살표로 놓일 방향을 미리 볼 수 있습니다. 타일은 5×5 범위 안에 놓으며, 화살표 경로를 따라 상대 타일을 뒤집습니다. 25개를 모두 놓거나 양쪽 모두 둘 수 없으면 타일이 많은 쪽이 승리합니다.</p>
<a href="../play/" style="color:var(--muted);font-size:13px">AI와 플레이하기 →</a>
</main>
<script type="module" src="./game.js"></script>
</body>
</html>
