<style>
  /* Galmuri11 (SIL OFL), Latin subset. Pixel font: keep sizes at multiples of 11px
     and never synthesize bold, or the pixels get smeared. */
  @font-face {
    font-family: "Galmuri11";
    src: url("/assets/25/fonts/Galmuri11-latin.woff") format("woff");
    font-display: swap;
  }
  :root {
    color-scheme: light dark;
    --bg: #f2f2f2;
    --fg: #000;

  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #4d4d4d; --fg: #f2f2f2; }
  }
  * { box-sizing: border-box; }
  html { font-synthesis: none; -webkit-font-smoothing: none; }
  body {
    margin: 0; min-height: 100vh; padding: 24px 16px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: var(--bg); color: var(--fg); text-align: center;
    font-family: "Galmuri11", ui-monospace, monospace; font-weight: 400;
  }
  h1 { margin: 0 0 22px; line-height: 0; }
  /* Logo.png is 137x111 dark pixels on transparent: scale by whole steps only. */
  h1 img { width: 274px; height: 222px; max-width: 100%; height: auto; image-rendering: pixelated; }
  @media (prefers-color-scheme: dark) { h1 img { filter: invert(1); } }
  a {
    display: block; width: 100%; max-width: 308px; padding: 14px 20px; margin-top: 11px;
    font-size: 22px; line-height: 22px; text-decoration: none;
    background: var(--fg); color: var(--bg);
  }
  a.alt { background: transparent; color: var(--fg); border: 4px solid var(--fg); padding: 10px 16px; margin-top: 0; }
  a:active { opacity: .8; }
  a:focus-visible { outline: 4px dashed #4d9eeb; outline-offset: 4px; }
</style>
</head>

<h1><img src="/assets/25/logo.png" alt="25" width="274" height="222"></h1>

<script>
// Shared-run link: https://ybs1164.github.io/25/?c=<character>&m=<mode>&s=<seed>
//
// Installed apps normally intercept this URL before the browser ever loads it
// (Android App Links - see addons/DeepLink/deep_link_plugin.gd). This page only
// runs when that doesn't happen: the app isn't installed, or the link was
// opened in an in-app browser (KakaoTalk, Instagram...) that ignores App Links.
// The intent:// URL covers both: it starts the app if installed, and otherwise
// falls back to the Play Store.
(function () {
  if (!/Android/i.test(navigator.userAgent)) return;
  var PACKAGE = 'com.numberer.twofive';
  var STORE = 'https://play.google.com/store/apps/details?id=' + PACKAGE;
  location.replace('intent://' + location.host + location.pathname + location.search +
    '#Intent;scheme=https;package=' + PACKAGE +
    ';S.browser_fallback_url=' + encodeURIComponent(STORE) + ';end');
})();
</script>
</body>
